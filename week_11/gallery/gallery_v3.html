<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
    <link rel="stylesheet" href="style.css">
    <title>Nature Grid Gallery</title>
</head>
<body>
    <h1>Nature Grid Gallery</h1>
    <section class="color-toolbar" aria-labelledby="color-toolbar-heading">
        <h2 id="color-toolbar-heading">Background color</h2>
        <div class="color-options">
            <button type="button" onclick="setBgColor('#ffffff')">White</button>
            <button type="button" onclick="setBgColor('#ffff00')">Yellow</button>
            <button type="button" onclick="setBgColor('#ff0000')">Red</button>
            <button type="button" onclick="setBgColor('#87ceeb')">Sky blue</button>
            <button type="button" onclick="setBgColor('#ffc0cb')">Pink</button>
            <button type="button" onclick="setDarkMode()">Dark mode</button>
        </div>
        <form id="custom-color-form">
            <label for="custom-color">Custom hex color</label>
            <input id="custom-color" name="custom-color" type="text" placeholder="#RRGGBB" maxlength="7" aria-describedby="custom-color-message">
            <button type="submit">Apply color</button>
            <span id="custom-color-message" role="status" aria-live="polite"></span>
        </form>
    </section>
    <div class="gallery-container">
        <figure class="main-display">
            <img id="large" src="images/thumb2.jpeg" alt="Two Sandhill cranes in a grassy area at Calvary Cemetery in Woodstock, Illinois, with a quiet cemetery landscape in the background.">
            <figcaption id="caption">Two Sandhill cranes in a grassy area at Calvary Cemetery in Woodstock, Illinois, with a quiet cemetery landscape in the background.</figcaption>
        </figure>
        <button class="thumb" type="button" onclick="change(this)"><img src="images/thumb1.jpeg" alt="A groundhog lying next to a dark stone entrance sign at Calvary Cemetery in Woodstock, Illinois."></button>
        <button class="thumb" type="button" onclick="change(this)"><img src="images/thumb2.jpeg" alt="Two Sandhill cranes in a grassy area at Calvary Cemetery in Woodstock, Illinois, with a quiet cemetery landscape in the background."></button>
        <button class="thumb" type="button" onclick="change(this)"><img src="images/thumb3.jpeg" alt="A different view of Two Sandhill cranes in a grassy area at Calvary Cemetery in Woodstock, Illinois."></button>
        <button class="thumb" type="button" onclick="change(this)"><img src="images/thumb4.jpeg" alt="A rabbit facing toward the camera on a sidewalk next to some green grass near Clarence Olson School."></button>
        <button class="thumb" type="button" onclick="change(this)"><img src="images/thumb5.jpeg" alt="An egret near a park bench next to the pond in Emricson Park."></button>
        <button class="thumb" type="button" onclick="change(this)"><img src="images/thumb6.jpeg" alt="An egret and two geese in the grass near the pond at Emricson Park."></button>
        <button class="thumb" type="button" onclick="change(this)"><img src="images/thumb7.jpeg" alt="A rabbit facing away from the camera on a sidewalk next to some green grass near Clarence Olson School."></button>
    </div>
    <footer>
        <br>
        © Copyright 2026 SD70MAC.
        <br> <a href="../../index.html">Back to Student Portal</a>
    </footer>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Responsive Railway Photo Album</title>
</head>
<header><h1>Responsive Railway Photo Album</h1></header>
<body>
    <figure class="figure">
    <picture>
        <source
            media="(max-width: 767px)"
            type="image/webp"
            srcset="images/barn-2-and-sd70mac-9400-480w-mobile.webp 480w"
            sizes="100vw"
        >
        <source
            type="image/webp"
            srcset="
                images/barn-2-and-sd70mac-9400-480w-mobile.webp 480w,
                images/barn-2-and-sd70mac-9400-800w.webp 800w,
                images/barn-2-and-sd70mac-9400-1200w.webp 1200w
            "
            sizes="(max-width: 1200px) 100vw, 1200px"
        >
        <img class="img-fluid" src="images/barn-2-and-sd70mac-9400-1200w.webp" alt="Green Bay &amp; Western RSD15 2407 and BNSF SD70MAC 9400 at Barn 2">
    </picture>
    <figcaption>
        <h3 class="h5 mt-2">At Barn 2</h3>
        <p>Green Bay &amp; Western RSD15 2407 and BNSF SD70MAC 9400.</p>
    </figcaption>
    </figure>

    <figure class="figure">
    <picture>
        <source
            media="(max-width: 767px)"
            type="image/webp"
            srcset="images/f40ph-metra-129-at-woodstock-480w-mobile.webp 480w"
            sizes="100vw"
        >
        <source
            type="image/webp"
            srcset="
                images/f40ph-metra-129-at-woodstock-480w-mobile.webp 480w,
                images/f40ph-metra-129-at-woodstock-800w.webp 800w,
                images/f40ph-metra-129-at-woodstock-1200w.webp 1200w
            "
            sizes="(max-width: 1200px) 100vw, 1200px"
        >
        <img class="img-fluid" src="images/f40ph-metra-129-at-woodstock-1200w.webp" alt="Metra F40PH 129 at Woodstock">
    </picture>
    <figcaption>
        <h3 class="h5 mt-2">Metra at Woodstock</h3>
        <p>Metra F40PH 129 at the Woodstock station.</p>
    </figcaption>
    </figure>

    <figure class="figure">
    <picture>
        <source
            media="(max-width: 767px)"
            type="image/webp"
            srcset="images/f40ph-metra-145-city-of-aurora-at-woodstock-outbound-480w-mobile.webp 480w"
            sizes="100vw"
        >
        <source
            type="image/webp"
            srcset="
                images/f40ph-metra-145-city-of-aurora-at-woodstock-outbound-480w-mobile.webp 480w,
                images/f40ph-metra-145-city-of-aurora-at-woodstock-outbound-800w.webp 800w,
                images/f40ph-metra-145-city-of-aurora-at-woodstock-outbound-1200w.webp 1200w
            "
            sizes="(max-width: 1200px) 100vw, 1200px"
        >
        <img class="img-fluid" src="images/f40ph-metra-145-city-of-aurora-at-woodstock-outbound-1200w.webp" alt="F40PH Metra 145 'City of Aurora' at Woodstock, Illinois. The locomotive is blue with an orange roof, and red and white nose stripes. There is some orange trim around the numberboards.">
    </picture>
    </figure>

    <figure class="figure">
    <picture>
        <source
            media="(max-width: 767px)"
            type="image/webp"
            srcset="images/the-nose-of-metra-f40c-614-edward-f-brabec-at-the-illinois-railway-museum-480w-mobile.webp 480w"
            sizes="100vw"
        >
        <source
            type="image/webp"
            srcset="
                images/the-nose-of-metra-f40c-614-edward-f-brabec-at-the-illinois-railway-museum-480w-mobile.webp 480w,
                images/the-nose-of-metra-f40c-614-edward-f-brabec-at-the-illinois-railway-museum-800w.webp 800w,
                images/the-nose-of-metra-f40c-614-edward-f-brabec-at-the-illinois-railway-museum-1200w.webp 1200w
            "
            sizes="(max-width: 1200px) 100vw, 1200px"
        >
        <img class="img-fluid" src="images/the-nose-of-metra-f40c-614-edward-f-brabec-at-the-illinois-railway-museum-1200w.webp" alt="The nose of Metra F40C 614 'Edward F. Brabec' at the Illinois Railway Museum. The locomotive is blue with an orange roof, and red and white nose stripes. There is some orange trim around the numberboards.">
    </picture>
    </figure>

    <figure class="figure">
    <picture>
        <source
            media="(max-width: 767px)"
            type="image/webp"
            srcset="images/walthers-trainline-model-of-metra-f40ph-163-city-of-elmhurst-480w-mobile.webp 480w"
            sizes="100vw"
        >
        <source
            type="image/webp"
            srcset="
                images/walthers-trainline-model-of-metra-f40ph-163-city-of-elmhurst-480w-mobile.webp 480w,
                images/walthers-trainline-model-of-metra-f40ph-163-city-of-elmhurst-800w.webp 800w,
                images/walthers-trainline-model-of-metra-f40ph-163-city-of-elmhurst-1200w.webp 1200w
            "
            sizes="(max-width: 1200px) 100vw, 1200px"
        >
        <img class="img-fluid" src="images/walthers-trainline-model-of-metra-f40ph-163-city-of-elmhurst-1200w.webp" alt="HO Scale Walthers Trainline model of Metra F40PH 163 'City of Elmhurst'.">
    </picture>
    <figcaption>
        <h3 class="h5 mt-2">Metra F40PH Model</h3>
        <p>A Walthers Trainline model of Metra F40PH 163, City of Elmhurst.</p>
    </figcaption>
    </figure>
